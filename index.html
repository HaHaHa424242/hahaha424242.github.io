<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黑屏控制台</title>
  <style>
    body {
      text-align: center;
      font-family: 'Arial', sans-serif;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      margin-top: 0;
      font-size: 2.5rem;
      color: #ff4d4d;
      text-shadow: 0 0 10px #ff4d4d, 0 0 20px #ff4d4d;
    }

    .button-grid {
      display: flex;
      gap: 30px;
      margin-top: 30px;
    }

    .button-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      font-size: 1.1rem;
      padding: 14px 20px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      min-width: 160px;
    }

    button:hover {
      background-color: #e60000;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    #status {
      margin-top: 30px;
      font-size: 1.2rem;
      color: #ffcc00;
      text-shadow: 0 0 5px #ffcc00;
    }

    .glow {
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #ffcc00, 0 0 10px #ffcc00, 0 0 20px #ffcc00;
      }
      to {
        text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00, 0 0 30px #ffcc00;
      }
    }
  </style>
</head>
<body>
  <h1>📴 黑屏控制台</h1>

  <div class="button-grid">
    <!-- 客戶端 -->
    <div class="button-column">
      <button onclick="sendCommand('client_black')">🖥️ 客戶端黑屏</button>
      <button onclick="sendCommand('client_restore')">🖥️ 客戶端解除</button>
    </div>

    <!-- 伺服器 -->
    <div class="button-column">
      <button onclick="sendCommand('server_black')">💻 伺服器黑屏</button>
      <button onclick="sendCommand('server_restore')">💻 伺服器解除</button>
    </div>

    <!-- 全部 -->
    <div class="button-column">
      <button onclick="sendCommand('all_black')">🌐 全部黑屏</button>
      <button onclick="sendCommand('all_restore')">🌐 全部解除</button>
    </div>
  </div>

  <p id="status" class="glow">狀態: 正在等待伺服器連接...</p>

  <script>
    let server_ip = "192.168.1.9"; // ⚠️ 請替換成實際的伺服器 IP
    let ws;

    function sendCommand(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
        alert(`✅ 指令已發送：${cmd}`);
      } else {
        alert("❌ 無法連線伺服器！");
      }
    }

    function connectToServer() {
      ws = new WebSocket(`ws://${server_ip}:12345`);

      ws.onopen = function () {
        document.getElementById("status").textContent = "狀態: 已連接到伺服器";
      };

      ws.onmessage = function (event) {
        document.getElementById("status").textContent = `狀態: 收到回應：${event.data}`;
      };

      ws.onclose = function () {
        document.getElementById("status").textContent = "狀態: 伺服器連線已關閉";
      };

      ws.onerror = function () {
        document.getElementById("status").textContent = "狀態: 伺服器連線錯誤";
      };
    }

    window.onload = connectToServer;
  </script>
</body>
</html>
